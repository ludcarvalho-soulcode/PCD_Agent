# cloudbuild.yaml — Agente TAC PCD · SoulCode
# Projeto: devsprojects-af12e

substitutions:
  _PROJECT_ID: devsprojects-af12e
  _REGION: us-central1
  _BACKEND_SVC: tac-pcd-backend
  _FRONTEND_SVC: tac-pcd-frontend
  _BUCKET: devsprojects-af12e-tac-pcd
  _SA: tac-pcd-agent-sa@devsprojects-af12e.iam.gserviceaccount.com

steps:
  # 1. Build backend
  - name: gcr.io/cloud-builders/docker
    id: build-backend
    args: [build, -t, "gcr.io/${_PROJECT_ID}/${_BACKEND_SVC}:${SHORT_SHA}", ./backend]

  # 2. Push backend
  - name: gcr.io/cloud-builders/docker
    id: push-backend
    args: [push, "gcr.io/${_PROJECT_ID}/${_BACKEND_SVC}:${SHORT_SHA}"]
    waitFor: [build-backend]

  # 3. Deploy backend
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-backend
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_BACKEND_SVC}
      - --image=gcr.io/${_PROJECT_ID}/${_BACKEND_SVC}:${SHORT_SHA}
      - --region=${_REGION}
      - --memory=2Gi
      - --cpu=2
      - --timeout=900
      - --min-instances=0
      - --max-instances=5
      - --set-env-vars=GCP_PROJECT_ID=${_PROJECT_ID},GCP_LOCATION=${_REGION},GCS_BUCKET_NAME=${_BUCKET}
      - --service-account=${_SA}
      - --allow-unauthenticated
      - --quiet
    waitFor: [push-backend]

  # 4. Build frontend
  - name: gcr.io/cloud-builders/docker
    id: build-frontend
    args: [build, -t, "gcr.io/${_PROJECT_ID}/${_FRONTEND_SVC}:${SHORT_SHA}", ./frontend]
    waitFor: [deploy-backend]

  # 5. Push frontend
  - name: gcr.io/cloud-builders/docker
    id: push-frontend
    args: [push, "gcr.io/${_PROJECT_ID}/${_FRONTEND_SVC}:${SHORT_SHA}"]
    waitFor: [build-frontend]

  # 6. Deploy frontend
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-frontend
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_FRONTEND_SVC}
      - --image=gcr.io/${_PROJECT_ID}/${_FRONTEND_SVC}:${SHORT_SHA}
      - --region=${_REGION}
      - --memory=256Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=3
      - --allow-unauthenticated
      - --quiet
    waitFor: [push-frontend]

images:
  - gcr.io/${_PROJECT_ID}/${_BACKEND_SVC}:${SHORT_SHA}
  - gcr.io/${_PROJECT_ID}/${_FRONTEND_SVC}:${SHORT_SHA}

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
